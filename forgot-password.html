<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password | GMAX Technology</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="admin-body">

  <div class="login-card">
    <h1>Reset Admin Password</h1>

    <p>
      Enter your GMAX administrator email address.
      We will send you a password reset link.
    </p>

    <form id="reset-form" class="form-grid">

      <div class="field full">
        <label>Email</label>
        <input
          type="email"
          id="email"
          required
          placeholder="gmaxtechnology58@yahoo.com"
        >
      </div>

      <div class="field full">
        <button class="btn btn-primary" type="submit">
          Send reset link
        </button>
      </div>

    </form>

    <div id="message" style="margin-top:15px;"></div>

    <p style="margin-top:20px;">
      <a href="admin.html">← Back to Admin Login</a>
    </p>
  </div>

  <script src="assets/config.js"></script>

  <script>
    const client = window.supabase.createClient(
      window.GMAX_CONFIG.SUPABASE_URL,
      window.GMAX_CONFIG.SUPABASE_ANON_KEY
    );

    const form = document.getElementById('reset-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();

      message.textContent = 'Sending reset link...';

      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/reset-password'
      });

      if (error) {
        message.textContent = 'Error: ' + error.message;
        return;
      }

      message.innerHTML =
        '<strong>Reset link sent.</strong><br>Please check your email inbox and Spam/Junk folder.';
    });
  </script>

</body>
</html>
